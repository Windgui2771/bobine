plugins { id 'com.android.application' }

android {
    namespace 'app.bobine.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'app.bobine.tv'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
        // vide = interface intégrée à l'APK. Sinon, adresse d'une installation web (ex. http://192.168.1.10:8095/)
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('appUrl') ?: ''}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'release'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets { main { assets.srcDirs += ["$buildDir/generated/webassets"] } }
}

// copie l'interface web (dossier ../../web) dans l'APK
tasks.register('copyWeb', Copy) {
    from "${rootDir}/../web"
    into "$buildDir/generated/webassets/www"
    exclude 'config.json'
}
preBuild.dependsOn copyWeb

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
